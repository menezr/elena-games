<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo redondeado estilo app nativa -->
  <rect width="512" height="512" rx="112" fill="#1E272C"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#000" stroke-width="24"/>
  
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C69"/>
      <stop offset="50%" stop-color="#FF758C"/>
      <stop offset="100%" stop-color="#E84393"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FF9F43"/>
    </linearGradient>
  </defs>

  <!-- Estrellita decorativa superior -->
  <path d="M400 90 L415 130 L455 145 L415 160 L400 200 L385 160 L345 145 L385 130 Z" fill="url(#starGrad)" stroke="#000" stroke-width="12" stroke-linejoin="round"/>

  <!-- Letra 'E' grande, gruesa y con estilo divertido -->
  <g transform="translate(130, 110)">
    <!-- Sombra dura estilo neobrutalista -->
    <path d="M 35 15 
             H 205 C 225 15, 235 25, 235 45 
             V 75 C 235 95, 225 105, 205 105 
             H 125 
             V 140 
             H 190 C 210 140, 220 150, 220 170 
             V 200 C 220 220, 210 230, 190 230 
             H 125 
             V 265 
             H 215 C 235 265, 245 275, 245 295 
             V 325 C 245 345, 235 355, 215 355 
             H 35 C 15 355, 5 345, 5 325 
             V 45 C 5 25, 15 15, 35 15 Z" 
          fill="#000" />

    <!-- Letra E principal en Blanco Puro -->
    <path d="M 30 10 
             H 200 C 220 10, 230 20, 230 40 
             V 70 C 230 90, 220 100, 200 100 
             H 120 
             V 135 
             H 185 C 205 135, 215 145, 215 165 
             V 195 C 215 215, 205 225, 185 225 
             H 120 
             V 260 
             H 210 C 230 260, 240 270, 240 290 
             V 320 C 240 340, 230 350, 210 350 
             H 30 C 10 350, 0 340, 0 320 
             V 40 C 0 20, 10 10, 30 10 Z" 
          fill="#FFFFFF" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
