<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Juego de Sílabas Mágico</title>
    
    <!-- Meta tags para apariencia de App Nativa (iOS y Android) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E272C">

    <!-- Favicon e Icono de App móvil -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* Márgenes seguros ampliados para separar de la cámara/hora y la barra inferior */
      .safe-pt { padding-top: max(2.25rem, env(safe-area-inset-top)); }
      .safe-pb { padding-bottom: max(2.25rem, env(safe-area-inset-bottom)); }

      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
        -webkit-transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
        -webkit-transform: rotateY(180deg);
      }
    </style>
</head>
<body class="bg-slate-900 m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;
        
        const useAudio = () => {
          const audioCtxRef = useRef(null);

          const getContext = () => {
            if (!audioCtxRef.current) {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              audioCtxRef.current = new AudioContext();
            }
            if (audioCtxRef.current.state === 'suspended') {
              audioCtxRef.current.resume();
            }
            return audioCtxRef.current;
          };

          const playTap = () => {
            try {
              const ctx = getContext();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
          };

          const playMatch = () => {
            try {
              const ctx = getContext();
              const now = ctx.currentTime;
              [523.25, 659.25, 783.99].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + i * 0.08);
                gain.gain.setValueAtTime(0.2, now + i * 0.08);
                gain.gain.linearRampToValueAtTime(0.01, now + i * 0.08 + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.08);
                osc.stop(now + i * 0.08 + 0.15);
              });
            } catch (e) {}
          };

          const playWin = () => {
            try {
              const ctx = getContext();
              const now = ctx.currentTime;
              const notes = [440, 554.37, 659.25, 880];
              notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + i * 0.12);
                gain.gain.setValueAtTime(0.25, now + i * 0.12);
                gain.gain.linearRampToValueAtTime(0.01, now + i * 0.12 + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.12);
                osc.stop(now + i * 0.12 + 0.25);
              });
            } catch (e) {}
          };

          return { playTap, playMatch, playWin };
        };

        const RotateCcw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );

        const Trophy = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );

        const ALL_SYLLABLES = [
          'LA', 'LE', 'LI', 'LO', 'LU',
          'MA', 'ME', 'MI', 'MO', 'MU',
          'PA', 'PE', 'PI', 'PO', 'PU',
          'SA', 'SE', 'SI', 'SO', 'SU',
          'TA', 'TE', 'TI', 'TO', 'TU',
          'CA', 'CO', 'CU',
          'DA', 'DE', 'DI', 'DO', 'DU',
          'NA', 'NE', 'NI', 'NO', 'NU',
          'BA', 'BE', 'BI', 'BO', 'BU',
          'FA', 'FE', 'FI', 'FO', 'FU',
          'ZA', 'ZE', 'ZI', 'ZO', 'ZU'
        ];

        const CARD_COLORS = [
          'bg-gradient-to-br from-pink-500 to-rose-600 border-rose-300',
          'bg-gradient-to-br from-purple-500 to-indigo-600 border-indigo-300',
          'bg-gradient-to-br from-amber-400 to-orange-500 border-amber-200',
          'bg-gradient-to-br from-emerald-400 to-teal-600 border-emerald-200',
          'bg-gradient-to-br from-cyan-400 to-blue-600 border-cyan-200',
          'bg-gradient-to-br from-fuchsia-500 to-pink-600 border-fuchsia-200',
          'bg-gradient-to-br from-lime-400 to-green-600 border-lime-200',
          'bg-gradient-to-br from-violet-500 to-purple-700 border-violet-200',
          'bg-gradient-to-br from-sky-400 to-blue-700 border-sky-200',
          'bg-gradient-to-br from-red-500 to-rose-700 border-red-200'
        ];

        const GAME_CONFIGS = {
          12: { pairs: 6, cols: 'grid-cols-3 grid-rows-4', label: '12 Cartas' },
          16: { pairs: 8, cols: 'grid-cols-4 grid-rows-4', label: '16 Cartas' },
          20: { pairs: 10, cols: 'grid-cols-4 grid-rows-5', label: '20 Cartas' }
        };

        function App() {
          const [totalCardsNum, setTotalCardsNum] = useState(12);
          const [cards, setCards] = useState([]);
          const [flippedIndices, setFlippedIndices] = useState([]);
          const [removedPairs, setRemovedPairs] = useState([]);
          const [currentPlayer, setCurrentPlayer] = useState(1);
          const [p1Score, setP1Score] = useState(0);
          const [p2Score, setP2Score] = useState(0);
          const [isWon, setIsWon] = useState(false);
          const [isProcessing, setIsProcessing] = useState(false);
          const { playTap, playMatch, playWin } = useAudio();

          const startNewGame = useCallback(() => {
            playTap();
            const config = GAME_CONFIGS[totalCardsNum];
            const numPairs = config.pairs;

            const shuffledSyllables = [...ALL_SYLLABLES]
              .sort(() => 0.5 - Math.random())
              .slice(0, numPairs);

            const syllableColorMap = {};
            const shuffledColors = [...CARD_COLORS].sort(() => 0.5 - Math.random());
            shuffledSyllables.forEach((syllable, idx) => {
              syllableColorMap[syllable] = shuffledColors[idx % shuffledColors.length];
            });

            const newCardList = [];
            shuffledSyllables.forEach((syllable) => {
              const colorClass = syllableColorMap[syllable];
              const randomRotation = (Math.random() * 8 - 4).toFixed(1);
              const randomX = (Math.random() * 4 - 2).toFixed(1);
              const randomY = (Math.random() * 4 - 2).toFixed(1);

              newCardList.push({ 
                id: `${syllable}-1`, 
                pairId: syllable, 
                syllable, 
                colorClass, 
                transformStyle: `rotate(${randomRotation}deg) translate(${randomX}px, ${randomY}px)` 
              });
              newCardList.push({ 
                id: `${syllable}-2`, 
                pairId: syllable, 
                syllable, 
                colorClass, 
                transformStyle: `rotate(${randomRotation * -1}deg) translate(${randomX * -1}px, ${randomY * -1}px)` 
              });
            });

            newCardList.sort(() => 0.5 - Math.random());

            setCards(newCardList);
            setFlippedIndices([]);
            setRemovedPairs([]);
            setP1Score(0);
            setP2Score(0);
            setCurrentPlayer(1);
            setIsWon(false);
            setIsProcessing(false);
          }, [totalCardsNum]);

          useEffect(() => {
            startNewGame();
          }, [totalCardsNum]);

          const handleCardClick = (index) => {
            if (
              isProcessing ||
              flippedIndices.includes(index) ||
              removedPairs.includes(cards[index].pairId)
            ) {
              return;
            }

            playTap();
            const newFlipped = [...flippedIndices, index];
            setFlippedIndices(newFlipped);

            if (newFlipped.length === 2) {
              setIsProcessing(true);
              const firstCard = cards[newFlipped[0]];
              const secondCard = cards[newFlipped[1]];

              if (firstCard.pairId === secondCard.pairId) {
                setTimeout(() => {
                  playMatch();
                  setRemovedPairs((prev) => [...prev, firstCard.pairId]);
                  setFlippedIndices([]);

                  if (currentPlayer === 1) {
                    setP1Score((s) => s + 1);
                  } else {
                    setP2Score((s) => s + 1);
                  }

                  setIsProcessing(false);
                }, 400);
              } else {
                setTimeout(() => {
                  setFlippedIndices([]);
                  setCurrentPlayer((prev) => (prev === 1 ? 2 : 1));
                  setIsProcessing(false);
                }, 800);
              }
            }
          };

          useEffect(() => {
            const totalPairs = GAME_CONFIGS[totalCardsNum].pairs;
            if (removedPairs.length === totalPairs && totalPairs > 0) {
              setIsWon(true);
              playWin();
            }
          }, [removedPairs, totalCardsNum]);

          const getWinnerText = () => {
            if (p1Score > p2Score) return '¡GANA JUGADOR 1!';
            if (p2Score > p1Score) return '¡GANA JUGADOR 2!';
            return '¡EMPATE!';
          };

          return (
            <div className="w-full h-screen h-[100dvh] font-sans select-none flex flex-col justify-between overflow-hidden relative bg-gradient-to-r from-[#FF8C69] via-[#FF758C] to-[#E84393]">
              
              {/* HEADER: JUGADOR 2 con margen superior seguro más amplio */}
              <header className="w-full bg-[#1E272C] text-white px-6 py-3 safe-pt border-b-4 border-black flex items-center justify-between shadow-lg z-25">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-[#00D2D3] border-2 border-black flex items-center justify-center font-black text-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                    J2
                  </div>
                  <div>
                    <div className="text-[10px] font-black text-[#00D2D3] uppercase tracking-wider">
                      JUGADOR 2
                    </div>
                    <div className="text-base font-black text-white leading-none">
                      {p2Score} {p2Score === 1 ? 'Punto' : 'Puntos'}
                    </div>
                  </div>
                </div>

                {currentPlayer === 2 && !isWon && (
                  <div className="bg-[#FF9F43] text-black border-2 border-black text-xs font-black px-3 py-1 rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] animate-bounce">
                    ¡TU TURNO!
                  </div>
                )}
              </header>

              {/* CONTROLES */}
              <div className="w-full px-4 py-1.5 bg-[#2D3436] border-y-2 border-black flex items-center justify-between gap-2 z-20">
                <div className="flex gap-1.5">
                  {[12, 16, 20].map((num) => (
                    <button
                      key={num}
                      onClick={() => setTotalCardsNum(num)}
                      className={`px-3 py-1 rounded-lg text-xs font-black border-2 transition-transform active:scale-90 ${
                        totalCardsNum === num
                          ? 'bg-[#00D2D3] text-black border-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]'
                          : 'bg-white text-gray-800 border-black'
                      }`}
                    >
                      {num}
                    </button>
                  ))}
                </div>

                <button
                  onClick={startNewGame}
                  className="flex items-center gap-1 bg-[#FF6B6B] border-2 border-black text-black text-xs font-black px-3 py-1 rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:scale-90"
                >
                  <RotateCcw size={14} /> Reiniciar
                </button>
              </div>

              {/* TABLERO */}
              <main className="flex-1 p-2 sm:p-3 flex items-center justify-center overflow-hidden w-full h-full">
                <div className="bg-[#9E6B47] border-4 border-black rounded-3xl p-3 sm:p-4 shadow-[0_8px_0_0_rgba(0,0,0,0.3)] w-full h-full flex items-center justify-center max-w-md sm:max-w-lg">
                  <div className={`grid ${GAME_CONFIGS[totalCardsNum].cols} gap-3 sm:gap-4 w-full h-full items-center justify-items-center`}>
                    {cards.map((card, index) => {
                      const isFlipped = flippedIndices.includes(index);
                      const isRemoved = removedPairs.includes(card.pairId);

                      if (isRemoved) {
                        return (
                          <div
                            key={card.id}
                            className="w-full h-full bg-transparent opacity-0 pointer-events-none"
                          />
                        );
                      }

                      return (
                        <div
                          key={card.id}
                          onClick={() => handleCardClick(index)}
                          style={{ transform: card.transformStyle }}
                          className="w-full h-[90%] max-h-[110px] perspective-1000 cursor-pointer transition-transform hover:scale-105"
                        >
                          <div className={`w-full h-full relative duration-500 transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
                            
                            {/* Dorso de la carta */}
                            <div className="absolute inset-0 w-full h-full bg-[#29B6F6] border-4 border-white outline outline-2 outline-black rounded-xl flex items-center justify-center shadow-[0_4px_0_0_rgba(0,0,0,0.25)] backface-hidden">
                              <div className="w-[88%] h-[88%] rounded-lg border-2 border-[#81D4FA]" />
                            </div>

                            {/* Frente de la carta */}
                            <div className={`absolute inset-0 w-full h-full ${card.colorClass} border-4 outline outline-2 outline-black rounded-xl flex items-center justify-center shadow-[0_4px_0_0_rgba(0,0,0,0.3)] backface-hidden rotate-y-180`}>
                              <span className="text-xl sm:text-2xl font-black text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)] tracking-wider">
                                {card.syllable}
                              </span>
                            </div>

                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </main>

              {/* FOOTER: JUGADOR 1 con margen inferior seguro más amplio para elevarlo del borde */}
              <footer className="w-full bg-[#1E272C] text-white px-6 py-3 safe-pb border-t-4 border-black flex items-center justify-between shadow-lg z-25">
                <div className="flex items-center gap-2">
                  <div className="w-9 h-9 rounded-xl bg-[#FF6B6B] border-2 border-black flex items-center justify-center font-black text-black text-sm shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                    J1
                  </div>
                  <div>
                    <div className="text-[10px] font-black text-[#FF6B6B] uppercase tracking-wider">
                      JUGADOR 1
                    </div>
                    <div className="text-base font-black text-white leading-none">
                      {p1Score} {p1Score === 1 ? 'Punto' : 'Puntos'}
                    </div>
                  </div>
                </div>

                {currentPlayer === 1 && !isWon && (
                  <div className="bg-[#FF9F43] text-black border-2 border-black text-xs font-black px-3 py-1 rounded-full shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] animate-bounce">
                    ¡TU TURNO!
                  </div>
                )}
              </footer>

              {/* MODAL GANADOR */}
              {isWon && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white border-4 border-black rounded-3xl p-6 max-w-xs w-full text-center shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
                    <div className="w-16 h-16 mx-auto bg-[#FF9F43] border-4 border-black rounded-2xl flex items-center justify-center text-black mb-3 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                      <Trophy size={36} />
                    </div>

                    <h2 className="text-2xl font-black text-black mb-1">
                      {getWinnerText()}
                    </h2>

                    <div className="my-4 bg-[#F1F2F6] border-2 border-black rounded-2xl p-3 grid grid-cols-2 gap-2 text-sm">
                      <div className="bg-[#FF6B6B] border-2 border-black p-2 rounded-xl text-black">
                        <span className="block text-[10px] font-black uppercase">J1</span>
                        <span className="text-xl font-black">{p1Score} pts</span>
                      </div>
                      <div className="bg-[#00D2D3] border-2 border-black p-2 rounded-xl text-black">
                        <span className="block text-[10px] font-black uppercase">J2</span>
                        <span className="text-xl font-black">{p2Score} pts</span>
                      </div>
                    </div>

                    <button
                      onClick={startNewGame}
                      className="w-full py-3 bg-[#FF9F43] border-4 border-black text-black font-black rounded-2xl text-sm shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-2"
                    >
                      <RotateCcw size={18} /> JUGAR OTRA VEZ
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
