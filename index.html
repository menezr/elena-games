<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Juego de Serpiente</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E272C">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        background-color: #1E272C;
        color: #F1F5F9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .safe-pt {
        padding-top: max(1rem, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box;
      }
    </style>
</head>
<body class="bg-[#1E272C] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const BOT_NAMES = ['Rayo', 'Viper', 'Zeta', 'Nox', 'Blaze', 'Kuro', 'Froz', 'Spark', 'Titan', 'Onyx'];

        const useAudio = () => {
          const audioCtxRef = useRef(null);

          const getContext = () => {
            if (!audioCtxRef.current) {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              audioCtxRef.current = new AudioContext();
            }
            if (audioCtxRef.current.state === 'suspended') {
              audioCtxRef.current.resume();
            }
            return audioCtxRef.current;
          };

          const playTap = () => {
            try {
              const ctx = getContext();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
          };

          const playEat = () => {
            try {
              const ctx = getContext();
              const now = ctx.currentTime;
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(300, now);
              osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
              gain.gain.setValueAtTime(0.2, now);
              gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.12);
            } catch (e) {}
          };

          const playCrash = () => {
            try {
              const ctx = getContext();
              const now = ctx.currentTime;
              [250, 180, 100].forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now + i * 0.1);
                gain.gain.setValueAtTime(0.25, now + i * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, now + i * 0.1 + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + i * 0.1);
                osc.stop(now + i * 0.1 + 0.15);
              });
            } catch (e) {}
          };

          return { playTap, playEat, playCrash };
        };

        const CrownIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="#FFD700" stroke="#000" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><circle cx="12" cy="18" r="1"/></svg>
        );

        const CloseIcon = ({ size = 20 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        const RotateCcw = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        );

        const COLORS = [
          { name: 'Turquesa', hex: '#00D2D3' },
          { name: 'Coral', hex: '#FF6B6B' },
          { name: 'Naranja', hex: '#FF9F43' },
          { name: 'Violeta', hex: '#A55EEA' },
          { name: 'Lima', hex: '#1DD1A1' }
        ];

        function App() {
          const [inMenu, setInMenu] = useState(true);
          const [difficulty, setDifficulty] = useState('normal'); 
          const [snakeColor, setSnakeColor] = useState(COLORS[0]);
          const [score, setScore] = useState(0);
          const [gameOver, setGameOver] = useState(false);
          const [paused, setPaused] = useState(false);
          const [showRanking, setShowRanking] = useState(false);
          const [rankingList, setRankingList] = useState([]);
          const [kingName, setKingName] = useState('Tú');

          const canvasRef = useRef(null);
          const joystickRef = useRef(null);
          const { playTap, playEat, playCrash } = useAudio();

          const stateRef = useRef({
            worldWidth: 2000,
            worldHeight: 2000,
            lastTime: 0,
            player: {
              x: 1000,
              y: 1000,
              angle: 0,
              targetAngle: 0,
              speed: 6.5,
              radius: 12,
              segments: [],
              color: COLORS[0],
              score: 0,
              alive: true,
              name: 'Tú'
            },
            npcs: [],
            foods: [],
            camera: { x: 0, y: 0 }
          });

          const touchJoystick = useRef({
            active: false,
            startX: 0,
            startY: 0,
            identifier: null
          });

          const startNewGame = () => {
            playTap();
            const worldW = 2000;
            const worldH = 2000;
            const foodMargin = 60;
            
            const playerSegments = [];
            for (let i = 0; i < 30; i++) {
              playerSegments.push({ x: 1000, y: 1000 + i * 5 });
            }

            const baseSpeed = difficulty === 'easy' ? 6.0 : difficulty === 'hard' ? 8.5 : 7.2;

            stateRef.current.player = {
              x: 1000,
              y: 1000,
              angle: -Math.PI / 2,
              targetAngle: -Math.PI / 2,
              speed: baseSpeed,
              radius: 12,
              segments: playerSegments,
              color: snakeColor,
              score: 0,
              alive: true,
              name: 'Tú'
            };

            const npcColors = COLORS.filter(c => c.name !== snakeColor.name);
            const npcs = [];
            const npcCount = difficulty === 'easy' ? 3 : difficulty === 'normal' ? 5 : 7;
            const shuffledNames = [...BOT_NAMES].sort(() => Math.random() - 0.5);
            
            for (let i = 0; i < npcCount; i++) {
              const nx = Math.random() * (worldW - 600) + 300;
              const ny = Math.random() * (worldH - 600) + 300;
              const nSegs = [];
              for (let j = 0; j < 25; j++) {
                nSegs.push({ x: nx, y: ny + j * 5 });
              }
              npcs.push({
                x: nx,
                y: ny,
                angle: Math.random() * Math.PI * 2,
                targetAngle: Math.random() * Math.PI * 2,
                speed: baseSpeed * 0.9,
                radius: 12,
                segments: nSegs,
                color: npcColors[i % npcColors.length],
                score: Math.floor(Math.random() * 30),
                alive: true,
                name: shuffledNames[i % shuffledNames.length],
                changeDirTimer: 0
              });
            }
            stateRef.current.npcs = npcs;

            // Comida de tamaños variados
            const foods = [];
            for (let i = 0; i < 120; i++) {
              foods.push({
                x: foodMargin + Math.random() * (worldW - foodMargin * 2),
                y: foodMargin + Math.random() * (worldH - foodMargin * 2),
                radius: 4 + Math.random() * 6, // Tamaños variados (4px a 10px)
                color: COLORS[Math.floor(Math.random() * COLORS.length)].hex
              });
            }
            stateRef.current.foods = foods;
            stateRef.current.lastTime = performance.now();

            setScore(0);
            setGameOver(false);
            setPaused(false);
            setShowRanking(false);
            setInMenu(false);
          };

          useEffect(() => {
            const handleTouchStart = (e) => {
              if (inMenu || gameOver || paused) return;
              const touch = e.changedTouches[0];
              if (!touchJoystick.current.active) {
                touchJoystick.current.active = true;
                touchJoystick.current.identifier = touch.identifier;
                touchJoystick.current.startX = touch.clientX;
                touchJoystick.current.startY = touch.clientY;
                if (joystickRef.current) {
                  joystickRef.current.style.display = 'block';
                  joystickRef.current.style.left = `${touch.clientX}px`;
                  joystickRef.current.style.top = `${touch.clientY}px`;
                }
              }
            };

            const handleTouchMove = (e) => {
              if (!touchJoystick.current.active) return;
              for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === touchJoystick.current.identifier) {
                  const dx = touch.clientX - touchJoystick.current.startX;
                  const dy = touch.clientY - touchJoystick.current.startY;
                  if (dx * dx + dy * dy > 25) {
                    stateRef.current.player.targetAngle = Math.atan2(dy, dx);
                  }
                }
              }
            };

            const handleTouchEnd = (e) => {
              for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === touchJoystick.current.identifier) {
                  touchJoystick.current.active = false;
                  if (joystickRef.current) {
                    joystickRef.current.style.display = 'none';
                  }
                }
              }
            };

            window.addEventListener('touchstart', handleTouchStart, { passive: true });
            window.addEventListener('touchmove', handleTouchMove, { passive: true });
            window.addEventListener('touchend', handleTouchEnd);

            return () => {
              window.removeEventListener('touchstart', handleTouchStart);
              window.removeEventListener('touchmove', handleTouchMove);
              window.removeEventListener('touchend', handleTouchEnd);
            };
          }, [inMenu, gameOver, paused]);

          useEffect(() => {
            if (inMenu) return;

            let animId;
            const foodMargin = 60;

            const gameLoop = (time) => {
              const state = stateRef.current;
              state.lastTime = time;

              if (!paused && !gameOver) {
                const player = state.player;

                if (player.alive) {
                  let angleDiff = player.targetAngle - player.angle;
                  while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                  while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                  player.angle += angleDiff * 0.25;

                  player.x += Math.cos(player.angle) * player.speed;
                  player.y += Math.sin(player.angle) * player.speed;

                  if (player.x < 10 || player.x > state.worldWidth - 10 || player.y < 10 || player.y > state.worldHeight - 10) {
                    player.alive = false;
                    playCrash();
                  }

                  player.segments.unshift({ x: player.x, y: player.y });
                  const targetSegLength = Math.floor(25 + player.score * 0.8);
                  while (player.segments.length > targetSegLength) {
                    player.segments.pop();
                  }
                }

                state.npcs.forEach(npc => {
                  if (!npc.alive) return;

                  npc.changeDirTimer--;
                  if (npc.changeDirTimer <= 0) {
                    npc.changeDirTimer = Math.floor(Math.random() * 40) + 20;
                    npc.targetAngle += (Math.random() - 0.5) * 1.5;
                  }

                  let angleDiff = npc.targetAngle - npc.angle;
                  while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                  while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                  npc.angle += angleDiff * 0.2;

                  npc.x += Math.cos(npc.angle) * npc.speed;
                  npc.y += Math.sin(npc.angle) * npc.speed;

                  if (npc.x < 10 || npc.x > state.worldWidth - 10 || npc.y < 10 || npc.y > state.worldHeight - 10) {
                    npc.alive = false;
                    playCrash();
                  }

                  npc.segments.unshift({ x: npc.x, y: npc.y });
                  const targetSegLen = Math.floor(25 + npc.score * 0.8);
                  while (npc.segments.length > targetSegLen) {
                    npc.segments.pop();
                  }
                });

                // Colisiones con comida variada
                if (player.alive) {
                  state.foods.forEach(food => {
                    const dx = player.x - food.x;
                    const dy = player.y - food.y;
                    const minDist = player.radius + food.radius;
                    if (dx * dx + dy * dy < minDist * minDist) {
                      playEat();
                      player.score += 5;
                      setScore(player.score);
                      food.x = foodMargin + Math.random() * (state.worldWidth - foodMargin * 2);
                      food.y = foodMargin + Math.random() * (state.worldHeight - foodMargin * 2);
                    }
                  });
                }

                state.npcs.forEach(npc => {
                  if (!npc.alive) return;
                  state.foods.forEach(food => {
                    const dx = npc.x - food.x;
                    const dy = npc.y - food.y;
                    const minDist = npc.radius + food.radius;
                    if (dx * dx + dy * dy < minDist * minDist) {
                      npc.score += 5;
                      food.x = foodMargin + Math.random() * (state.worldWidth - foodMargin * 2);
                      food.y = foodMargin + Math.random() * (state.worldHeight - foodMargin * 2);
                    }
                  });
                });

                const allSnakes = [player, ...state.npcs].filter(s => s.alive);

                for (let i = 0; i < allSnakes.length; i++) {
                  for (let j = i + 1; j < allSnakes.length; j++) {
                    const s1 = allSnakes[i];
                    const s2 = allSnakes[j];
                    const dx = s1.x - s2.x;
                    const dy = s1.y - s2.y;
                    if (dx * dx + dy * dy < 576) {
                      s1.alive = false;
                      s2.alive = false;
                      playCrash();
                    }
                  }
                }

                allSnakes.forEach(snake => {
                  if (!snake.alive) return;
                  allSnakes.forEach(other => {
                    if (!other.alive || snake === other) return;

                    for (let k = 0; k < other.segments.length; k += 3) {
                      const seg = other.segments[k];
                      const dx = snake.x - seg.x;
                      const dy = snake.y - seg.y;
                      if (dx * dx + dy * dy < 256) {
                        snake.alive = false;
                        playCrash();
                      }
                    }
                  });
                });

                if (!player.alive && !gameOver) {
                  setGameOver(true);
                }

                state.npcs.forEach(npc => {
                  if (!npc.alive && Math.random() < 0.02) {
                    npc.x = Math.random() * (state.worldWidth - 400) + 200;
                    npc.y = Math.random() * (state.worldHeight - 400) + 200;
                    npc.segments = [];
                    npc.score = 0;
                    npc.alive = true;
                    for (let j = 0; j < 25; j++) {
                      npc.segments.push({ x: npc.x, y: npc.y + j * 5 });
                    }
                  }
                });

                const sortedSnakes = [player, ...state.npcs]
                  .filter(s => s.alive)
                  .map(s => ({ name: s.name, score: s.score, length: s.segments.length }))
                  .sort((a, b) => b.length - a.length);

                setRankingList(sortedSnakes);
                if (sortedSnakes.length > 0) setKingName(sortedSnakes[0].name);
              }

              // Renderizado optimizado a 60 FPS (Sin Glow/Sombras)
              const canvas = canvasRef.current;
              if (canvas) {
                const ctx = canvas.getContext('2d');
                const parent = canvas.parentElement;
                if (parent && (canvas.width !== parent.clientWidth || canvas.height !== parent.clientHeight)) {
                  canvas.width = parent.clientWidth;
                  canvas.height = parent.clientHeight;
                }

                const player = state.player;
                const camTargetX = player.alive ? player.x : state.worldWidth / 2;
                const camTargetY = player.alive ? player.y : state.worldHeight / 2;

                state.camera.x += (camTargetX - canvas.width / 2 - state.camera.x) * 0.15;
                state.camera.y += (camTargetY - canvas.height / 2 - state.camera.y) * 0.15;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(-state.camera.x, -state.camera.y);

                ctx.fillStyle = '#151C20';
                ctx.fillRect(0, 0, state.worldWidth, state.worldHeight);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 2;
                for (let x = 0; x <= state.worldWidth; x += 100) {
                  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, state.worldHeight); ctx.stroke();
                }
                for (let y = 0; y <= state.worldHeight; y += 100) {
                  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(state.worldWidth, y); ctx.stroke();
                }

                ctx.strokeStyle = '#FF6B6B';
                ctx.lineWidth = 6;
                ctx.strokeRect(0, 0, state.worldWidth, state.worldHeight);

                // Dibujar Comida (Semitransparente y con tamaños variados)
                state.foods.forEach(f => {
                  ctx.save();
                  ctx.globalAlpha = 0.65; // Ligeramente transparente
                  ctx.fillStyle = f.color;
                  ctx.beginPath();
                  ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                  ctx.fill();
                  ctx.restore();
                });

                const allActiveSnakes = [player, ...state.npcs].filter(s => s.alive);
                allActiveSnakes.forEach(snake => {
                  if (snake.segments.length < 2) return;

                  ctx.strokeStyle = snake.color.hex;
                  ctx.lineWidth = snake.radius * 1.8;
                  ctx.lineCap = 'round';
                  ctx.lineJoin = 'round';

                  ctx.beginPath();
                  snake.segments.forEach((seg, idx) => {
                    if (idx === 0) ctx.moveTo(seg.x, seg.y);
                    else ctx.lineTo(seg.x, seg.y);
                  });
                  ctx.stroke();

                  const head = snake.segments[0];
                  ctx.fillStyle = '#FFFFFF';
                  ctx.beginPath();
                  ctx.arc(head.x, head.y, snake.radius * 0.7, 0, Math.PI * 2);
                  ctx.fill();

                  ctx.fillStyle = '#FFFFFF';
                  ctx.font = 'bold 12px sans-serif';
                  ctx.textAlign = 'center';
                  ctx.fillText(snake.name, head.x, head.y - snake.radius - 8);

                  if (snake.name === kingName) {
                    ctx.font = '16px sans-serif';
                    ctx.fillText('👑', head.x, head.y - snake.radius - 24);
                  }
                });

                ctx.restore();
              }

              animId = requestAnimationFrame(gameLoop);
            };

            animId = requestAnimationFrame(gameLoop);
            return () => cancelAnimationFrame(animId);
          }, [inMenu, paused, gameOver, difficulty, kingName]);

          if (inMenu) {
            return (
              <div className="w-full h-screen h-[100dvh] font-sans select-none flex flex-col items-center justify-center p-6 bg-gradient-to-r from-[#FF8C69] via-[#FF758C] to-[#E84393] overflow-y-auto">
                <div className="relative bg-white border-4 border-black rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-5 my-auto">
                  
                  {/* Botón X para volver al index principal */}
                  <a 
                    href="index.html"
                    className="absolute top-4 right-4 w-9 h-9 bg-[#FF6B6B] border-2 border-black rounded-xl flex items-center justify-center text-white shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:scale-95"
                    aria-label="Cerrar"
                  >
                    <CloseIcon size={18} />
                  </a>

                  <div className="w-16 h-16 mx-auto bg-[#00D2D3] border-4 border-black rounded-2xl flex items-center justify-center text-3xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    🐍
                  </div>
                  
                  <h1 className="text-2xl sm:text-3xl font-black text-black leading-tight">
                    Serpiente
                  </h1>

                  <div className="flex flex-col gap-1.5 text-left">
                    <label className="text-xs font-black uppercase text-gray-700">Dificultad de Bots:</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      {[
                        { id: 'easy', label: 'Fácil' },
                        { id: 'normal', label: 'Normal' },
                        { id: 'hard', label: 'Difícil' }
                      ].map((d) => (
                        <button
                          key={d.id}
                          onClick={() => { playTap(); setDifficulty(d.id); }}
                          className={`py-2 rounded-xl text-xs font-black border-2 border-black transition-all ${
                            difficulty === d.id 
                              ? 'bg-[#00D2D3] text-black shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] scale-105' 
                              : 'bg-gray-100 text-gray-600'
                          }`}
                        >
                          {d.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex flex-col gap-1.5 text-left">
                    <label className="text-xs font-black uppercase text-gray-700">Tu Color:</label>
                    <div className="flex justify-between gap-1.5">
                      {COLORS.map((col) => (
                        <button
                          key={col.name}
                          onClick={() => { playTap(); setSnakeColor(col); }}
                          className={`w-10 h-10 rounded-xl border-2 border-black transition-transform ${
                            snakeColor.name === col.name ? 'scale-110 ring-2 ring-black shadow-md' : 'opacity-75'
                          }`}
                          style={{ backgroundColor: col.hex }}
                        />
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={startNewGame}
                    className="w-full py-3.5 bg-[#FF9F43] border-4 border-black text-black font-black rounded-2xl text-base shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95 mt-1 transition-all"
                  >
                    ¡COMENZAR JUEGO!
                  </button>
                </div>
              </div>
            );
          }

          return (
            <div className="relative w-full h-screen h-[100dvh] overflow-hidden select-none bg-[#1E272C]">
              <canvas ref={canvasRef} className="block w-full h-full cursor-crosshair" />

              {/* HUD Superior */}
              <div className="absolute top-0 left-0 right-0 p-3 flex justify-between items-start pointer-events-none safe-pt z-20">
                <div className="flex gap-2 pointer-events-auto">
                  <a 
                    href="index.html"
                    className="bg-white border-2 border-black px-3 py-1.5 rounded-xl shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] flex items-center gap-1.5 text-black font-black active:scale-95 text-xs"
                  >
                    <CloseIcon size={16} /> MENÚ
                  </a>

                  <div className="bg-white border-2 border-black px-3 py-1.5 rounded-xl shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] flex items-center gap-1.5">
                    <span className="text-[11px] font-black text-gray-600">PTS:</span>
                    <span className="text-xs font-black text-black">{score}</span>
                  </div>
                </div>

                <div className="flex gap-2 pointer-events-auto">
                  <button 
                    onClick={() => { playTap(); setShowRanking(true); }}
                    className="bg-white border-2 border-black px-3 py-1.5 rounded-xl shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] flex items-center gap-1.5 text-black active:scale-95"
                  >
                    <CrownIcon size={16} />
                    <span className="text-xs font-black">{kingName}</span>
                  </button>
                </div>
              </div>

              {/* Joystick */}
              <div 
                ref={joystickRef} 
                className="absolute w-20 h-20 rounded-full border-2 border-white/40 bg-white/10 hidden pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-30"
              />

              {/* Ranking Modal */}
              {showRanking && (
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white border-4 border-black rounded-3xl p-5 max-w-xs w-full text-center shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-3">
                    <h2 className="text-lg font-black text-black">RANKING EN VIVO</h2>
                    <div className="flex flex-col gap-1.5 max-h-48 overflow-y-auto pr-1">
                      {rankingList.map((item, index) => (
                        <div key={index} className="bg-gray-100 px-3 py-2 rounded-xl border-2 border-black flex justify-between items-center text-xs font-black">
                          <span className="text-black flex items-center gap-2">
                            {index === 0 ? '👑' : `${index + 1}.`} {item.name}
                          </span>
                          <span className="text-rose-600">{item.score} pts</span>
                        </div>
                      ))}
                    </div>
                    <button
                      onClick={() => { playTap(); setShowRanking(false); }}
                      className="w-full py-2.5 bg-[#00D2D3] border-4 border-black text-black font-black rounded-xl text-xs shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] active:scale-95 mt-1"
                    >
                      CERRAR
                    </button>
                  </div>
                </div>
              )}

              {/* Game Over Modal */}
              {gameOver && (
                <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white border-4 border-black rounded-3xl p-6 max-w-xs w-full text-center shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-4">
                    <h2 className="text-2xl font-black text-rose-600">¡FIN DEL JUEGO!</h2>
                    <div className="bg-gray-100 p-3 rounded-2xl border-2 border-black">
                      <p className="text-xs font-black text-gray-500">PUNTUACIÓN FINAL</p>
                      <p className="text-2xl font-black text-black">{score}</p>
                    </div>
                    <button
                      onClick={startNewGame}
                      className="w-full py-3 bg-[#FF9F43] border-4 border-black text-black font-black rounded-2xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-2 text-sm"
                    >
                      <RotateCcw size={18} /> JUGAR DE NUEVO
                    </button>
                    <a
                      href="index.html"
                      className="text-xs font-black text-gray-600 underline hover:text-black"
                    >
                      Volver al Menú
                    </a>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
