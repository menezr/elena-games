<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ELE GAMES</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#E84393">

    <!-- Favicon e Icono de App móvil -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .safe-pt {
        padding-top: max(1.5rem, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box;
      }
      .safe-pb {
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)) !important;
        box-sizing: border-box;
      }
    </style>
</head>
<body class="bg-gradient-to-r from-[#FF8C69] via-[#FF758C] to-[#E84393] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useRef } = React;

        const useAudio = () => {
          const audioCtxRef = useRef(null);
          const playTap = () => {
            try {
              if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
              }
              const ctx = audioCtxRef.current;
              if (ctx.state === 'suspended') ctx.resume();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
          };
          return { playTap };
        };

        const Trophy = ({ size = 32 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );

        const SnakeVector = ({ size = 28 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 2h-4a2 2 0 0 0-2 2v4h4v4h-4v4a2 2 0 0 0 2 2h4"/><path d="M6 6h6"/><path d="M6 10h2"/><path d="M6 14h4"/><path d="M6 18h6"/></svg>
        );

        const BookVector = ({ size = 28 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        );

        function App() {
          const { playTap } = useAudio();

          const handleNavigate = (url) => {
            playTap();
            setTimeout(() => {
              window.location.href = url;
            }, 120);
          };

          return (
            <div className="w-full h-screen h-[100dvh] font-sans select-none flex flex-col items-center justify-center p-6 overflow-hidden safe-pt safe-pb">
              <div className="bg-white border-4 border-black rounded-3xl p-7 sm:p-9 max-w-sm w-full text-center shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-6 my-auto rotate-1">
                
                {/* Cabecera con la Copa */}
                <div className="w-20 h-20 mx-auto bg-[#00D2D3] border-4 border-black rounded-3xl flex items-center justify-center text-black shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] -rotate-2">
                  <Trophy size={40} />
                </div>
                
                <div className="flex flex-col gap-1">
                  <h1 className="text-3xl sm:text-4xl font-black text-black leading-tight tracking-wide">
                    Centro de Juegos
                  </h1>
                  <p className="text-sm font-black uppercase text-gray-600 tracking-wider">
                    Elige tu diversión
                  </p>
                </div>

                {/* Botones ligeramente desordenados */}
                <div className="flex flex-col gap-4 mt-2">
                  <button
                    onClick={() => handleNavigate('snake.html')}
                    className="w-full py-4 bg-[#00D2D3] border-4 border-black text-black font-black rounded-2xl text-lg shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-3 transition-transform -rotate-1 hover:rotate-0"
                  >
                    <SnakeVector size={30} /> Serpiente
                  </button>

                  <button
                    onClick={() => handleNavigate('silabas.html')}
                    className="w-full py-4 bg-[#FF9F43] border-4 border-black text-black font-black rounded-2xl text-lg shadow-[5px_5px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-3 transition-transform rotate-1 hover:rotate-0"
                  >
                    <BookVector size={30} /> Juego de Sílabas
                  </button>
                </div>

              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
