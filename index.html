<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centro de Juegos Mágico</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#E84393">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .safe-pt {
        padding-top: max(1.5rem, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box;
      }
      .safe-pb {
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)) !important;
        box-sizing: border-box;
      }
    </style>
</head>
<body class="bg-gradient-to-r from-[#FF8C69] via-[#FF758C] to-[#E84393] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useRef } = React;

        const useAudio = () => {
          const audioCtxRef = useRef(null);
          const playTap = () => {
            try {
              if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
              }
              const ctx = audioCtxRef.current;
              if (ctx.state === 'suspended') ctx.resume();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
          };
          return { playTap };
        };

        function App() {
          const { playTap } = useAudio();

          const handleNavigate = (url) => {
            playTap();
            setTimeout(() => {
              window.location.href = url;
            }, 120);
          };

          return (
            <div className="w-full h-screen h-[100dvh] font-sans select-none flex flex-col items-center justify-center p-6 overflow-hidden safe-pt safe-pb">
              <div className="bg-white border-4 border-black rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col gap-5 my-auto">
                <div className="w-16 h-16 mx-auto bg-[#00D2D3] border-4 border-black rounded-2xl flex items-center justify-center text-3xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                  🎮
                </div>
                
                <h1 className="text-2xl sm:text-3xl font-black text-black leading-tight">
                  Centro de Juegos
                </h1>
                <p className="text-xs font-black uppercase text-gray-500 tracking-wider">
                  Elige tu juego favorito
                </p>

                <div className="flex flex-col gap-3 mt-1">
                  <button
                    onClick={() => handleNavigate('snake.html')}
                    className="w-full py-3.5 bg-[#00D2D3] border-4 border-black text-black font-black rounded-2xl text-base shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-3 transition-transform"
                  >
                    <span className="text-xl">🐍</span> Serpiente
                  </button>

                  <button
                    onClick={() => handleNavigate('silabas.html')}
                    className="w-full py-3.5 bg-[#FF9F43] border-4 border-black text-black font-black rounded-2xl text-base shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95 flex items-center justify-center gap-3 transition-transform"
                  >
                    <span className="text-xl">📚</span> Juego de Sílabas
                  </button>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
