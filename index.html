<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centro de Juegos</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F4F6F9">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        background-color: #F4F6F9;
        color: #1E272C;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .safe-pt {
        padding-top: max(1.5rem, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box;
      }
      .safe-pb {
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)) !important;
        box-sizing: border-box;
      }
    </style>
</head>
<body class="bg-[#F4F6F9] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useRef } = React;

        const CloseIcon = ({ size = 22 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );

        function App() {
          const handleClose = () => {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.close();
            }
          };

          return (
            <div className="relative w-full h-screen h-[100dvh] flex flex-col items-center justify-between p-5 bg-[#F4F6F9] overflow-y-auto safe-pt safe-pb">
              
              {/* Botón X arriba a la derecha */}
              <div className="w-full flex justify-end">
                <button 
                  onClick={handleClose}
                  className="w-11 h-11 bg-[#FF6B6B] border-4 border-black rounded-2xl flex items-center justify-center text-white shadow-[3px_3px_0px_0px_rgba(0,0,0,0.8)] active:scale-95 transition-all"
                  aria-label="Cerrar"
                >
                  <CloseIcon />
                </button>
              </div>

              {/* Contenido Central */}
              <div className="max-w-md w-full flex flex-col gap-6 my-auto items-center">
                
                {/* Cabecera */}
                <div className="text-center flex flex-col items-center gap-2">
                  <div className="w-20 h-20 bg-[#00D2D3] border-4 border-black rounded-3xl flex items-center justify-center text-4xl shadow-[5px_5px_0px_0px_rgba(0,0,0,0.8)]">
                    🎮
                  </div>
                  <h1 className="text-3xl font-black text-gray-900 tracking-wide mt-2">
                    CENTRO DE JUEGOS
                  </h1>
                  <p className="text-xs font-extrabold text-gray-500 uppercase tracking-wider">
                    ¿Qué quieres jugar hoy?
                  </p>
                </div>

                {/* Tarjetas de Selección */}
                <div className="w-full flex flex-col gap-4">
                  
                  {/* Opción 1: Serpiente */}
                  <a
                    href="snake.html"
                    className="w-full bg-white border-4 border-black rounded-3xl p-4 shadow-[6px_6px_0px_0px_rgba(0,0,0,0.8)] active:scale-95 transition-all flex items-center gap-4 group"
                  >
                    <div className="w-14 h-14 bg-[#00D2D3] border-3 border-black rounded-2xl flex items-center justify-center text-2xl shadow-[3px_3px_0px_0px_rgba(0,0,0,0.8)] flex-shrink-0">
                      🐍
                    </div>
                    <div className="flex flex-col text-left">
                      <h2 className="text-xl font-black text-gray-900 tracking-wide">Serpiente</h2>
                      <p className="text-xs font-bold text-gray-500">Esquiva, come y domina el mapa.</p>
                    </div>
                  </a>

                  {/* Opción 2: Sílabas */}
                  <a
                    href="silabas.html"
                    className="w-full bg-white border-4 border-black rounded-3xl p-4 shadow-[6px_6px_0px_0px_rgba(0,0,0,0.8)] active:scale-95 transition-all flex items-center gap-4 group"
                  >
                    <div className="w-14 h-14 bg-[#FFD700] border-3 border-black rounded-2xl flex items-center justify-center text-2xl shadow-[3px_3px_0px_0px_rgba(0,0,0,0.8)] flex-shrink-0">
                      📚
                    </div>
                    <div className="flex flex-col text-left">
                      <h2 className="text-xl font-black text-gray-900 tracking-wide">Juego de Sílabas</h2>
                      <p className="text-xs font-bold text-gray-500">Aprende jugando con palabras.</p>
                    </div>
                  </a>

                </div>

              </div>

              {/* Pie de página */}
              <div className="text-[11px] font-black text-gray-400 uppercase tracking-widest">
                Modo App Móvil
              </div>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
