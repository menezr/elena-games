<!DOCTYPE html>
<html lang="es" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>El Juego de Tarjetas de Elena 💖</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cardRed: '#FF9AA2',
                        cardOrange: '#FFB7B2',
                        cardYellow: '#FFDAC1',
                        cardGreen: '#E2F0CB',
                        cardMint: '#B5EAD7',
                        cardPurple: '#C7CEEA',
                        cardPink: '#F6A6FF',
                        switchBg: '#F2F5FB'
                    },
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Mobile Touch locks */
        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #EEF3F8;
        }

        /* 3D Card Physics & Shadows */
        .game-card {
            box-shadow: 0 10px 0px 0px rgba(0, 0, 0, 0.08), 0 12px 20px -4px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
            will-change: transform;
        }

        .game-card:active {
            transform: translateY(6px) scale(0.96);
            box-shadow: 0 4px 0px 0px rgba(0, 0, 0, 0.08), 0 6px 10px -2px rgba(0, 0, 0, 0.1);
        }

        .card-selected {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 14px 0px 0px rgba(168, 85, 247, 0.3), 0 16px 25px -4px rgba(168, 85, 247, 0.2);
        }

        /* 3D Flip Card Effect */
        .perspective-1000 {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.5rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Bouncy Keyframes */
        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Custom Scrollbar for horizontal card deck */
        .card-deck-scroll {
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-deck-scroll::-webkit-scrollbar {
            display: none;
        }
        .card-snap-item {
            scroll-snap-align: center;
        }
    </style>
</head>
<body class="h-full flex flex-col justify-between p-3 max-w-md mx-auto relative overflow-hidden">

    <!-- TOP HEADER BAR -->
    <header class="w-full bg-white/90 backdrop-blur-md rounded-2xl p-3 shadow-md border-2 border-white flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-gradient-to-tr from-pink-400 to-purple-400 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner font-bold">
                🎴
            </div>
            <div>
                <h1 class="text-base sm:text-lg font-extrabold text-slate-800 leading-tight">
                    El Elena Game 💖
                </h1>
                <p class="text-[10px] sm:text-xs font-bold text-purple-600 font-quicksand uppercase tracking-wide">
                    Tarjetas de Sílabas
                </p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Voice Sound Toggle -->
            <button id="btn-audio" onclick="toggleAudio()" class="w-10 h-10 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-xl flex items-center justify-center shadow-sm border border-emerald-200 active:scale-90 transition">
                <i id="audio-icon" class="fa-solid fa-volume-high text-lg"></i>
            </button>

            <!-- Stars Counter -->
            <div class="bg-amber-100 text-amber-700 font-extrabold px-3 py-1.5 rounded-xl border border-amber-300 flex items-center space-x-1 shadow-sm">
                <span class="text-amber-500 text-lg">⭐</span>
                <span id="star-count" class="text-base font-extrabold">0</span>
            </div>
        </div>
    </header>

    <!-- MAIN INTERACTIVE SCREEN -->
    <main class="flex-grow flex flex-col justify-center items-center relative my-2 z-10 w-full overflow-hidden">

        <!-- ===================================== -->
        <!-- MODULE 1: MESA DE TARJETAS (EXPLORAR) -->
        <!-- ===================================== -->
        <section id="mod-explorer" class="w-full h-full flex flex-col justify-between items-center">
            
            <!-- Top Instruction Banner -->
            <div class="w-full bg-white/80 border border-white rounded-2xl p-2.5 shadow-sm text-center mb-2">
                <span class="text-xs sm:text-sm font-extrabold text-purple-900 flex items-center justify-center space-x-1">
                    <span>👈 Toca una consonante y abre sus sílabas 👉</span>
                </span>
            </div>

            <!-- CONSONANT CARDS CAROUSEL / DECK -->
            <div class="w-full mb-3 shrink-0">
                <div id="consonants-deck" class="card-deck-scroll flex space-x-3 py-2 px-1 w-full">
                    <!-- Consonant Cards loaded dynamically via JS -->
                </div>
            </div>

            <!-- SYLLABLE CARDS GRID (A, E, I, O, U) -->
            <div class="w-full flex-grow flex flex-col justify-center">
                <div class="text-xs font-extrabold text-slate-400 mb-1.5 uppercase text-center tracking-wider">
                    Tarjetas Mágicas (<span id="active-consonant-title" class="text-purple-600 font-black">M</span>)
                </div>
                <div id="syllables-cards-container" class="grid grid-cols-2 gap-2.5 w-full max-h-[310px] overflow-y-auto p-1">
                    <!-- Dynamic Syllable 3D Flip Cards -->
                </div>
            </div>

        </section>

        <!-- ===================================== -->
        <!-- MODULE 2: ENCUENTRA LA TARJETA (QUIZ) -->
        <!-- ===================================== -->
        <section id="mod-find" class="w-full h-full flex flex-col justify-around items-center hidden">
            
            <div class="w-full bg-white rounded-3xl p-4 shadow-lg border-2 border-white text-center flex flex-col items-center">
                <span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full mb-2">Reto de Escucha 🎧</span>
                <h2 id="find-prompt-text" class="text-2xl font-black text-slate-800 my-1">
                    ¿Dónde está <span class="text-pink-500 font-black underline decoration-wavy">MA</span>?
                </h2>
                <button onclick="playFindPromptAudio()" class="mt-2 bg-purple-500 active:bg-purple-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center space-x-2 shadow-md">
                    <i class="fa-solid fa-volume-high text-sm"></i>
                    <span>Escuchar de nuevo</span>
                </button>
            </div>

            <!-- 3 Choice Cards -->
            <div id="find-cards-grid" class="w-full grid grid-cols-1 gap-3 my-auto px-2">
                <!-- 3 Large Option Cards generated dynamically -->
            </div>

        </section>

        <!-- ===================================== -->
        <!-- MODULE 3: ARMA LA PALABRA (BUILDER)  -->
        <!-- ===================================== -->
        <section id="mod-builder" class="w-full h-full flex flex-col justify-between items-center hidden">
            
            <!-- Target Word Banner -->
            <div class="w-full bg-white rounded-3xl p-3 shadow-lg border-2 border-white flex flex-col items-center">
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Junta las tarjetas para formar:</span>
                
                <div id="builder-target-emoji" class="text-5xl my-1 animate-bounce">🍎</div>
                <div id="builder-target-name" class="text-xl font-black text-purple-700 uppercase">MANZANA</div>

                <!-- Word Card Slots -->
                <div class="flex space-x-2 mt-2">
                    <div id="slot-1" class="w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner">
                        ?
                    </div>
                    <div class="text-2xl font-black text-slate-300 flex items-center">+</div>
                    <div id="slot-2" class="w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner">
                        ?
                    </div>
                </div>
            </div>

            <!-- Available Syllables Deck -->
            <div class="w-full bg-white/60 backdrop-blur-sm rounded-3xl p-3 border border-white my-2">
                <span class="text-xs font-bold text-slate-500 uppercase block text-center mb-2">Toca las tarjetas correctas:</span>
                <div id="builder-cards-bank" class="grid grid-cols-2 gap-2">
                    <!-- Dynamic selectable cards -->
                </div>
            </div>

            <!-- Reset action -->
            <button onclick="resetBuilder()" class="text-slate-400 hover:text-slate-600 font-bold text-xs flex items-center space-x-1">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Reiniciar esta palabra</span>
            </button>

        </section>

    </main>

    <!-- BOTTOM FIXED NAVIGATION (THUMB FRIENDLY) -->
    <nav class="w-full bg-white/95 backdrop-blur-md rounded-2xl p-1.5 shadow-xl border-2 border-white flex justify-around items-center z-20 shrink-0">
        <button onclick="switchTab('explorer')" id="tab-explorer" class="flex-1 py-2 rounded-xl flex flex-col items-center justify-center transition-all bg-pastelPink text-purple-950 font-bold shadow-sm">
            <span class="text-lg">🎴</span>
            <span class="text-[11px] font-extrabold mt-0.5">1. Tarjetas</span>
        </button>
        <button onclick="switchTab('find')" id="tab-find" class="flex-1 py-2 rounded-xl flex flex-col items-center justify-center transition-all text-slate-500 font-bold">
            <span class="text-lg">🎯</span>
            <span class="text-[11px] font-extrabold mt-0.5">2. Buscar</span>
        </button>
        <button onclick="switchTab('builder')" id="tab-builder" class="flex-1 py-2 rounded-xl flex flex-col items-center justify-center transition-all text-slate-500 font-bold">
            <span class="text-lg">🧩</span>
            <span class="text-[11px] font-extrabold mt-0.5">3. Crear</span>
        </button>
    </nav>

    <!-- REWARD / SUCCESS POPUP MODAL -->
    <div id="reward-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full text-center shadow-2xl border-4 border-cardYellow transform transition-all scale-95 animate-pop">
            <div class="text-6xl mb-2">🌟</div>
            <h3 id="reward-title" class="text-2xl font-black text-purple-700 mb-1">
                ¡Increíble, Elena!
            </h3>
            <p id="reward-subtitle" class="text-slate-600 font-bold mb-4 text-xs">
                ¡Ganaste una nueva estrella!
            </p>
            <button onclick="closeRewardModal()" class="w-full bg-gradient-to-r from-cardPink to-cardPurple text-purple-950 font-black py-3 rounded-2xl shadow-lg border-2 border-white text-base active:scale-95">
                ¡Seguir Jugando! 🚀
            </button>
        </div>
    </div>

    <script>
        /* GAME DATA */
        const CONSONANTS = ['M', 'P', 'S', 'L', 'T', 'D', 'N', 'R', 'C', 'F', 'B', 'V', 'G'];
        const VOWELS = ['A', 'E', 'I', 'O', 'U'];

        const PASTEL_PALETTE = [
            { bg: 'bg-cardRed', border: 'border-red-200', text: 'text-red-950', accent: '#FF9AA2' },
            { bg: 'bg-cardOrange', border: 'border-orange-200', text: 'text-orange-950', accent: '#FFB7B2' },
            { bg: 'bg-cardYellow', border: 'border-amber-200', text: 'text-amber-950', accent: '#FFDAC1' },
            { bg: 'bg-cardGreen', border: 'border-emerald-200', text: 'text-emerald-950', accent: '#E2F0CB' },
            { bg: 'bg-cardMint', border: 'border-teal-200', text: 'text-teal-950', accent: '#B5EAD7' },
            { bg: 'bg-cardPurple', border: 'border-purple-200', text: 'text-purple-950', accent: '#C7CEEA' },
            { bg: 'bg-cardPink', border: 'border-pink-200', text: 'text-pink-950', accent: '#F6A6FF' }
        ];

        const SYLLABLE_DICTIONARY = {
            'MA': { word: 'Manzana', emoji: '🍎' },
            'ME': { word: 'Mesa', emoji: '🪑' },
            'MI': { word: 'Miel', emoji: '🍯' },
            'MO': { word: 'Mono', emoji: '🐒' },
            'MU': { word: 'Muñeca', emoji: '🪆' },

            'PA': { word: 'Pato', emoji: '🦆' },
            'PE': { word: 'Pelota', emoji: '⚽' },
            'PI': { word: 'Piña', emoji: '🍍' },
            'PO': { word: 'Pollo', emoji: '🐥' },
            'PU': { word: 'Puerta', emoji: '🚪' },

            'SA': { word: 'Sapo', emoji: '🐸' },
            'SE': { word: 'Serpiente', emoji: '🐍' },
            'SI': { word: 'Silla', emoji: '🪑' },
            'SO': { word: 'Sol', emoji: '☀️' },
            'SU': { word: 'Submarino', emoji: '🚤' },

            'LA': { word: 'Lápiz', emoji: '✏️' },
            'LE': { word: 'León', emoji: '🦁' },
            'LI': { word: 'Limón', emoji: '🍋' },
            'LO': { word: 'Loro', emoji: '🦜' },
            'LU': { word: 'Luna', emoji: '🌙' },

            'TA': { word: 'Taza', emoji: '☕' },
            'TE': { word: 'Tenedor', emoji: '🍴' },
            'TI': { word: 'Tigre', emoji: '🐯' },
            'TO': { word: 'Tomate', emoji: '🍅' },
            'TU': { word: 'Tucán', emoji: '🦜' },

            'DA': { word: 'Dado', emoji: '🎲' },
            'DE': { word: 'Dedo', emoji: '👆' },
            'DI': { word: 'Dinosaurio', emoji: '🦕' },
            'DO': { word: 'Delfín', emoji: '🐬' },
            'DU': { word: 'Dulce', emoji: '🍬' },

            'NA': { word: 'Naranja', emoji: '🍊' },
            'NE': { word: 'Nieve', emoji: '❄️' },
            'NI': { word: 'Nido', emoji: '🪹' },
            'NO': { word: 'Noche', emoji: '🌌' },
            'NU': { word: 'Nube', emoji: '☁️' },

            'RA': { word: 'Ratón', emoji: '🐭' },
            'RE': { word: 'Regalo', emoji: '🎁' },
            'RI': { word: 'Río', emoji: '🌊' },
            'RO': { word: 'Rosa', emoji: '🌹' },
            'RU': { word: 'Rueda', emoji: '🛞' },

            'CA': { word: 'Casa', emoji: '🏠' },
            'CE': { word: 'Cebra', emoji: '🦓' },
            'CI': { word: 'Cisne', emoji: '🦢' },
            'CO': { word: 'Conejo', emoji: '🐰' },
            'CU': { word: 'Cuna', emoji: '🛏️' },

            'FA': { word: 'Farol', emoji: '🏮' },
            'FE': { word: 'Feliz', emoji: '😀' },
            'FI': { word: 'Fiesta', emoji: '🎉' },
            'FO': { word: 'Foca', emoji: '🦭' },
            'FU': { word: 'Fuego', emoji: '🔥' },

            'BA': { word: 'Ballena', emoji: '🐳' },
            'BE': { word: 'Bebé', emoji: '👶' },
            'BI': { word: 'Bici', emoji: '🚲' },
            'BO': { word: 'Bota', emoji: '🥾' },
            'BU': { word: 'Búho', emoji: '🦉' },

            'VA': { word: 'Vaca', emoji: '🐮' },
            'VE': { word: 'Vela', emoji: '🕯️' },
            'VI': { word: 'Viento', emoji: '🌬️' },
            'VO': { word: 'Volcán', emoji: '🌋' },
            'VU': { word: 'Vuelo', emoji: '✈️' },

            'GA': { word: 'Gato', emoji: '🐱' },
            'GE': { word: 'Gema', emoji: '💎' },
            'GI': { word: 'Girasol', emoji: '🌻' },
            'GO': { word: 'Gorra', emoji: '🧢' },
            'GU': { word: 'Gusano', emoji: '🐛' }
        };

        const BUILDER_WORDS = [
            { word: 'MAMA', syllables: ['MA', 'MA'], emoji: '👩', name: 'Mamá' },
            { word: 'PAPA', syllables: ['PA', 'PA'], emoji: '🥔', name: 'Papa' },
            { word: 'PUMA', syllables: ['PU', 'MA'], emoji: '🐆', name: 'Puma' },
            { word: 'LUNA', syllables: ['LU', 'NA'], emoji: '🌙', name: 'Luna' },
            { word: 'MAPA', syllables: ['MA', 'PA'], emoji: '🗺️', name: 'Mapa' },
            { word: 'SOPA', syllables: ['SO', 'PA'], emoji: '🍲', name: 'Sopa' },
            { word: 'GATO', syllables: ['GA', 'TO'], emoji: '🐱', name: 'Gato' },
            { word: 'VACA', syllables: ['VA', 'CA'], emoji: '🐮', name: 'Vaca' }
        ];

        /* STATE */
        let currentConsonant = 'M';
        let currentTab = 'explorer';
        let stars = 0;
        let audioEnabled = true;

        let findTargetSyllable = '';
        let builderIndex = 0;
        let builderSlots = ['', ''];

        const synth = window.speechSynthesis;

        function speak(text) {
            if (!audioEnabled || !('speechSynthesis' in window)) return;
            try {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                utterance.pitch = 1.15;
                synth.speak(utterance);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        window.onload = function() {
            renderConsonantCards();
            loadExplorerSyllableCards(currentConsonant);
            initFindGame();
            initBuilderGame();
        };

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audio-icon');
            const btn = document.getElementById('btn-audio');
            if (audioEnabled) {
                icon.className = 'fa-solid fa-volume-high text-lg';
                btn.className = 'w-10 h-10 bg-emerald-100 text-emerald-700 rounded-xl flex items-center justify-center shadow-sm border border-emerald-200 active:scale-90 transition';
                speak("¡Sonido activado!");
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-lg text-rose-500';
                btn.className = 'w-10 h-10 bg-rose-100 text-rose-700 rounded-xl flex items-center justify-center shadow-sm border border-rose-200 active:scale-90 transition';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const tabs = ['explorer', 'find', 'builder'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const mod = document.getElementById(`mod-${t}`);
                if (t === tab) {
                    btn.className = 'flex-1 py-2 rounded-xl flex flex-col items-center justify-center transition-all bg-pastelPink text-purple-950 font-bold shadow-sm scale-105';
                    mod.classList.remove('hidden');
                } else {
                    btn.className = 'flex-1 py-2 rounded-xl flex flex-col items-center justify-center transition-all text-slate-400 font-bold opacity-75';
                    mod.classList.add('hidden');
                }
            });

            if (tab === 'find') initFindGame();
            if (tab === 'builder') initBuilderGame();
        }

        function renderConsonantCards() {
            const container = document.getElementById('consonants-deck');
            container.innerHTML = '';

            CONSONANTS.forEach((c, index) => {
                const color = PASTEL_PALETTE[index % PASTEL_PALETTE.length];
                const isSelected = c === currentConsonant;

                const card = document.createElement('div');
                card.id = `c-card-${c}`;
                card.className = `card-snap-item game-card ${color.bg} ${color.border} ${color.text} border-3 rounded-2xl w-16 h-20 sm:w-20 sm:h-24 shrink-0 flex flex-col items-center justify-center cursor-pointer ${isSelected ? 'card-selected ring-4 ring-purple-400' : ''}`;
                
                card.onclick = () => {
                    currentConsonant = c;
                    updateConsonantSelection();
                    loadExplorerSyllableCards(c);
                    speak(`Letra ${c}`);
                };

                card.innerHTML = `
                    <span class="text-xs font-black opacity-60">Letra</span>
                    <span class="text-3xl font-black mt-0.5">${c}</span>
                `;
                container.appendChild(card);
            });
        }

        function updateConsonantSelection() {
            CONSONANTS.forEach(c => {
                const card = document.getElementById(`c-card-${c}`);
                if (card) {
                    if (c === currentConsonant) {
                        card.classList.add('card-selected', 'ring-4', 'ring-purple-400');
                    } else {
                        card.classList.remove('card-selected', 'ring-4', 'ring-purple-400');
                    }
                }
            });
            document.getElementById('active-consonant-title').innerText = currentConsonant;
        }

        function loadExplorerSyllableCards(c) {
            const container = document.getElementById('syllables-cards-container');
            container.innerHTML = '';

            VOWELS.forEach((v, index) => {
                const syllable = c + v;
                const info = SYLLABLE_DICTIONARY[syllable] || { word: syllable, emoji: '✨' };
                const color = PASTEL_PALETTE[(index + 2) % PASTEL_PALETTE.length];

                // 3D Flip Card Container
                const flipWrapper = document.createElement('div');
                flipWrapper.className = 'perspective-1000 w-full h-28 animate-pop';
                flipWrapper.style.animationDelay = `${index * 0.06}s`;

                flipWrapper.innerHTML = `
                    <div id="flip-inner-${syllable}" class="flip-card-inner cursor-pointer" onclick="handleSyllableCardClick('${syllable}', '${info.word}')">
                        <!-- FRONT OF CARD -->
                        <div class="flip-card-front game-card ${color.bg} ${color.border} border-3 p-3 flex flex-col items-center justify-between">
                            <span class="text-[10px] font-black ${color.text} opacity-60 uppercase tracking-widest">${c} + ${v}</span>
                            <span class="text-4xl font-black ${color.text}">${syllable}</span>
                            <span class="text-xs font-extrabold text-slate-500">Toca para voltear 🔄</span>
                        </div>
                        <!-- BACK OF CARD (ILLUSTRATION) -->
                        <div class="flip-card-back game-card bg-white border-3 ${color.border} p-2 flex flex-col items-center justify-center text-center">
                            <span class="text-3xl mb-1">${info.emoji}</span>
                            <span class="text-lg font-black text-purple-900 leading-tight">${info.word}</span>
                            <span class="text-[10px] font-bold text-pink-600 mt-0.5">Empieza con ${syllable}</span>
                        </div>
                    </div>
                `;
                container.appendChild(flipWrapper);
            });
        }

        function handleSyllableCardClick(syllable, word) {
            const inner = document.getElementById(`flip-inner-${syllable}`);
            const isFlipped = inner.classList.contains('is-flipped');

            if (!isFlipped) {
                inner.classList.add('is-flipped');
                speak(`${syllable}. De ${word}`);
            } else {
                inner.classList.remove('is-flipped');
                speak(syllable);
            }
        }

        function initFindGame() {
            const available = VOWELS.map(v => currentConsonant + v);
            findTargetSyllable = available[Math.floor(Math.random() * available.length)];

            document.getElementById('find-prompt-text').innerHTML = `
                ¿Dónde está la tarjeta <span class="text-pink-600 font-black underline decoration-wavy">${findTargetSyllable}</span>?
            `;

            playFindPromptAudio();

            // Options logic
            let options = [findTargetSyllable];
            while (options.length < 3) {
                const randV = VOWELS[Math.floor(Math.random() * VOWELS.length)];
                const candidate = currentConsonant + randV;
                if (!options.includes(candidate)) options.push(candidate);
            }
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('find-cards-grid');
            grid.innerHTML = '';

            options.forEach((syl, index) => {
                const color = PASTEL_PALETTE[index * 2 % PASTEL_PALETTE.length];
                const card = document.createElement('button');
                card.className = `game-card ${color.bg} ${color.border} border-3 rounded-2xl p-4 w-full text-4xl font-black ${color.text} flex items-center justify-around active:scale-95 transition`;
                card.innerHTML = `
                    <span>🎴</span>
                    <span>${syl}</span>
                    <span>✨</span>
                `;
                card.onclick = () => checkFindCard(syl, card);
                grid.appendChild(card);
            });
        }

        function playFindPromptAudio() {
            speak(`Elena, busca la tarjeta ${findTargetSyllable}`);
        }

        function checkFindCard(selected, cardElem) {
            speak(selected);
            if (selected === findTargetSyllable) {
                cardElem.classList.add('ring-4', 'ring-emerald-400');
                triggerReward("¡Excelente, Elena!", `¡Encontraste la tarjeta ${findTargetSyllable}!`);
                setTimeout(() => {
                    initFindGame();
                }, 1600);
            } else {
                cardElem.classList.add('animate-shake');
                speak(`Esa es ${selected}. ¡Busca otra vez!`);
                setTimeout(() => {
                    cardElem.classList.remove('animate-shake');
                }, 500);
            }
        }

        function initBuilderGame() {
            const currentItem = BUILDER_WORDS[builderIndex % BUILDER_WORDS.length];
            builderSlots = ['', ''];

            document.getElementById('builder-target-emoji').innerText = currentItem.emoji;
            document.getElementById('builder-target-name').innerText = currentItem.name;

            document.getElementById('slot-1').innerText = '?';
            document.getElementById('slot-1').className = "w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner";
            
            document.getElementById('slot-2').innerText = '?';
            document.getElementById('slot-2').className = "w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner";

            // Bank options
            let bank = [...currentItem.syllables];
            while (bank.length < 4) {
                const randC = CONSONANTS[Math.floor(Math.random() * CONSONANTS.length)];
                const randV = VOWELS[Math.floor(Math.random() * VOWELS.length)];
                const randSyl = randC + randV;
                if (!bank.includes(randSyl)) bank.push(randSyl);
            }
            bank.sort(() => Math.random() - 0.5);

            const container = document.getElementById('builder-cards-bank');
            container.innerHTML = '';

            bank.forEach((syl, index) => {
                const color = PASTEL_PALETTE[index % PASTEL_PALETTE.length];
                const card = document.createElement('button');
                card.className = `game-card ${color.bg} ${color.border} border-2 rounded-2xl p-3 text-2xl font-black ${color.text} flex items-center justify-center shadow-md active:scale-95 transition`;
                card.innerText = syl;
                card.onclick = () => selectBuilderCard(syl);
                container.appendChild(card);
            });

            speak(`Arma la palabra ${currentItem.name}`);
        }

        function selectBuilderCard(syl) {
            speak(syl);

            if (builderSlots[0] === '') {
                builderSlots[0] = syl;
                const slot1 = document.getElementById('slot-1');
                slot1.innerText = syl;
                slot1.className = "w-16 h-16 bg-cardPink border-2 border-pink-300 rounded-2xl flex items-center justify-center text-2xl font-black text-purple-950 shadow-md animate-pop";
            } else if (builderSlots[1] === '') {
                builderSlots[1] = syl;
                const slot2 = document.getElementById('slot-2');
                slot2.innerText = syl;
                slot2.className = "w-16 h-16 bg-cardMint border-2 border-teal-300 rounded-2xl flex items-center justify-center text-2xl font-black text-teal-950 shadow-md animate-pop";

                checkBuilderWord();
            }
        }

        function checkBuilderWord() {
            const currentItem = BUILDER_WORDS[builderIndex % BUILDER_WORDS.length];
            const formed = builderSlots.join('');
            const target = currentItem.syllables.join('');

            if (formed === target) {
                setTimeout(() => {
                    speak(`¡Genial Elena! Formaste ${currentItem.name}`);
                    triggerReward("¡Palabra Completa!", `¡Formaste ${currentItem.name}!`);
                    builderIndex++;
                    setTimeout(() => {
                        initBuilderGame();
                    }, 1600);
                }, 300);
            } else {
                setTimeout(() => {
                    speak("¡Casi! Inténtalo de nuevo");
                    resetBuilder();
                }, 500);
            }
        }

        function resetBuilder() {
            builderSlots = ['', ''];
            document.getElementById('slot-1').innerText = '?';
            document.getElementById('slot-1').className = "w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner";
            document.getElementById('slot-2').innerText = '?';
            document.getElementById('slot-2').className = "w-16 h-16 bg-slate-100 border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center text-2xl font-black text-slate-700 shadow-inner";
        }

        function triggerReward(title, subtitle) {
            stars += 1;
            document.getElementById('star-count').innerText = stars;

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { y: 0.7 },
                    colors: ['#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7', '#C7CEEA']
                });
            }

            document.getElementById('reward-title').innerText = title;
            document.getElementById('reward-subtitle').innerText = subtitle;
            document.getElementById('reward-modal').classList.remove('hidden');
        }

        function closeRewardModal() {
            document.getElementById('reward-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
