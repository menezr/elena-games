<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Centro de Juegos</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1E272C">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        background-color: #1E272C;
        color: #F1F5F9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      .safe-pt {
        padding-top: max(1.5rem, env(safe-area-inset-top, 0px)) !important;
        box-sizing: border-box;
      }
      .safe-pb {
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 0px)) !important;
        box-sizing: border-box;
      }
      .neon-glow-cyan {
        box-shadow: 0 0 20px rgba(0, 210, 211, 0.4);
      }
      .neon-glow-pink {
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.4);
      }
    </style>
</head>
<body class="bg-[#1E272C] m-0 p-0 overflow-hidden select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useRef } = React;

        // Sonido de toque opcional
        const useAudio = () => {
          const audioCtxRef = useRef(null);

          const playTap = () => {
            try {
              if (!audioCtxRef.current) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtxRef.current = new AudioContext();
              }
              const ctx = audioCtxRef.current;
              if (ctx.state === 'suspended') ctx.resume();

              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(400, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.15, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.08);
            } catch (e) {}
          };

          return { playTap };
        };

        const GamepadIcon = ({ size = 28 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="4"></rect></svg>
        );

        const BookIcon = ({ size = 28 }) => (
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        );

        function App() {
          const { playTap } = useAudio();

          const navigateTo = (url) => {
            playTap();
            setTimeout(() => {
              window.location.href = url;
            }, 100);
          };

          return (
            <div className="w-full h-screen h-[100dvh] font-sans select-none flex flex-col items-center justify-center p-5 bg-[#1E272C] overflow-y-auto safe-pt safe-pb">
              <div className="max-w-md w-full flex flex-col gap-6 my-auto items-center">
                
                {/* Encabezado */}
                <div className="text-center flex flex-col items-center gap-2">
                  <div className="w-16 h-16 bg-[#00D2D3] border-4 border-black rounded-3xl flex items-center justify-center text-black shadow-[6px_6px_0px_0px_rgba(0,0,0,0.8)] neon-glow-cyan">
                    <span className="text-3xl font-black">🕹️</span>
                  </div>
                  <h1 className="text-2xl sm:text-3xl font-black text-white tracking-wide mt-2">
                    CENTRO DE JUEGOS
                  </h1>
                  <p className="text-xs sm:text-sm font-bold text-gray-400">
                    Selecciona una aplicación para comenzar
                  </p>
                </div>

                {/* Tarjetas de Navegación */}
                <div className="w-full flex flex-col gap-4">
                  
                  {/* Tarjeta de Snake */}
                  <button
                    onClick={() => navigateTo('snake.html')}
                    className="w-full bg-[#2D3436] border-4 border-black rounded-3xl p-5 text-left shadow-[6px_6px_0px_0px_rgba(0,0,0,0.8)] active:scale-95 transition-all flex items-center gap-4 group hover:bg-[#343b3e]"
                  >
                    <div className="w-14 h-14 bg-[#00D2D3] border-2 border-black rounded-2xl flex items-center justify-center text-black shadow-[3px_3px_0px_0px_rgba(0,0,0,0.8)] flex-shrink-0 group-hover:scale-105 transition-transform">
                      <GamepadIcon size={28} />
                    </div>
                    <div className="flex flex-col">
                      <h2 className="text-lg font-black text-white tracking-wide">Neon Slither</h2>
                      <p className="text-xs font-bold text-gray-400 mt-0.5">Juego de serpiente multijugador con bots y neón.</p>
                    </div>
                  </button>

                  {/* Tarjeta de Silabas */}
                  <button
                    onClick={() => navigateTo('silabas.html')}
                    className="w-full bg-[#2D3436] border-4 border-black rounded-3xl p-5 text-left shadow-[6px_6px_0px_0px_rgba(0,0,0,0.8)] active:scale-95 transition-all flex items-center gap-4 group hover:bg-[#343b3e]"
                  >
                    <div className="w-14 h-14 bg-[#FF6B6B] border-2 border-black rounded-2xl flex items-center justify-center text-white shadow-[3px_3px_0px_0px_rgba(0,0,0,0.8)] flex-shrink-0 group-hover:scale-105 transition-transform">
                      <BookIcon size={28} />
                    </div>
                    <div className="flex flex-col">
                      <h2 className="text-lg font-black text-white tracking-wide">Aprende Sílabas</h2>
                      <p className="text-xs font-bold text-gray-400 mt-0.5">Actividades educativas e interactivas.</p>
                    </div>
                  </button>

                </div>

                <span className="text-[11px] font-bold text-gray-500 mt-2">
                  Optimizado para Móviles y Web
                </span>

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
